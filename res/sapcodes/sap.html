	<button onclick="clearSearch()">clear</button>
	<input type="text" id="searchInput" onkeyup="show_filtered_products()" placeholder="🔍 Search...">

	<div id="productGrid"></div>



		<script src="https://nkg26.github.io/ifb/res/sapcodes/cls-MyIFB.js"></script>	
		<script src="https://nkg26.github.io/ifb/MyIFB_ABC.js"></script>

		<script src="https://nkg26.github.io/ifb/cls-IFB.js"></script>	
		<script src="https://nkg26.github.io/libs/js/cls-MyFile.js"></script>	
		<script src="https://nkg26.github.io/libs/js/cls-MyTable.js"></script>	
		<script src="https://nkg26.github.io/libs/js/cls-MyFontSize.js"></script>	
		<script src="https://nkg26.github.io/libs/js/cls-PlainTable.js"></script>	
	
		<script>
		const FONTS = new MyFontSize();	 FONTS.id = 'productGrid';
		const uniq = '?rnd='+Math.floor(Math.random()*10000);
		const MY_TABLE = new PlainTable();
		const PFX = new FX_MyPList();
		const TAB = new MyTable();
		const IFB1 = new MyIFB();
		const SAP = {}; // output container...
		const SRC = [
			{uid:"codes",    reload:'n', mergeData:'n', key:"CODE-NE", path:"https://nkg26.github.io/ifb/res/sapcodes/SAP-CODES-NE.txt"},
			{uid:"names",   reload:'y', mergeData:'y', key:"SAP-NAME", path:"https://nkg26.github.io/ifb/res/sapcodes/SAP-NAMES-REF.txt"},
			{uid:"names",   reload:'y', mergeData:'y', key:"SAP-NAME", path:"https://nkg26.github.io/ifb/res/sapcodes/SAP-NAMES-AC.txt"},
			{uid:"names",   reload:'y', mergeData:'y', key:"SAP-NAME", path:"https://nkg26.github.io/ifb/res/sapcodes/SAP-NAMES-OTH.txt"},
			{uid:"mrpdp",   reload:'y', mergeData:'y', key:"SAP-MRP-DP", path:"https://nkg26.github.io/ifb/res/sapcodes/SAP-CODES-MRP-DP-REF.txt"},
			{uid:"mrpdp",   reload:'y', mergeData:'y', key:"SAP-MRP-DP", path:"https://nkg26.github.io/ifb/res/sapcodes/SAP-CODES-MRP-DP.txt"},
			{uid:"channel", reload:'y', mergeData:'y', key:"SAP-CHANNEL", path:"https://nkg26.github.io/ifb/res/sapcodes/SAP-CODES-Channels.txt"}
		];
		
	// final plist data...
	function getPListData(){
		return SAP.codes;
	}
		
	function toPlist(DATA){
		let tab = TAB.splitToTable(DATA);
		IFB1.updateTableHeader(tab);
		return PFX.toPList(tab);
	}
		
	function mergeSapData(MAIN, ADD){
		if(MAIN && ADD && MAIN.length >0 && ADD.length>0){
			PFX.mergeLists(MAIN, ADD,"sapcode");
			return true;
		}
		return false;
	}
	
	function showData(){
		MY_TABLE.table_data = PFX.toTablularData(getPListData());
		show_filtered_products();
	}
	
	function showHtml(html){
		document.getElementById("productGrid").innerHTML = html;
	}
	
	function loadFile(PPP){
		let myfile = new MyFile(PPP.path+uniq);
		myfile.loadFile().then(() => {
			handleText(PPP, myfile.getFinalOutput());
		});
	}
	
	
	
	function handleText(PP, DATA){
		const OBJ = SAP;
		const VAR = PP.uid;
		
		// initialize value
		if(OBJ[VAR] === undefined ||  OBJ[VAR] === null)  OBJ[VAR]=[];
		
		let newPList = toPlist(DATA);
		
		// we will merge columns...
		if(PP.uid === "mrpdp"){
			PFX.addMergedKeys(newPList,"mrp-dp-mop-2611",["mrp","dp","mop"]);
			PFX.delKeys(newPList,["mrp","dp","mop"]);
		}
		
		// append data 
		OBJ[VAR] = OBJ[VAR].concat(newPList);
				
		if(PP.mergeData === 'y') mergeSapData(getPListData(), OBJ[VAR]);
		if(PP.reload === 'y') 	showData();
	}
	function start(){ for(let i=0; i<SRC.length; i++)	loadFile(SRC[i]);}
	setTimeout(start,10);




	function clearSearch(){
		document.getElementById('searchInput').value='';
		show_filtered_products();
		
	}
	function show_filtered_products(){ 
		var val = document.getElementById('searchInput').value;
		let data = MY_TABLE.filterByText(val);
		showFinalData(data);
	}
	
	function showFinalData(table_data){
		var html = MY_TABLE.FX_TABLE.generateBasicHtmlTable(table_data);
		document.getElementById('productGrid').innerHTML = html;
	}
  
  </script>
