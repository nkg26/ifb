    Dynamic Read
	<select id="pageDropdown"></select>
    <button onclick="goToPage()">Go</button>


		<script src="https://nkg26.github.io/ifb/cls-IFB.js"></script>	
		<script src="https://nkg26.github.io/libs/js/cls-MyFile.js"></script>	
		<script src="https://nkg26.github.io/libs/js/cls-MyTable.js"></script>	
		<script src="https://nkg26.github.io/libs/js/cls-MyFontSize.js"></script>	
		<script src="https://nkg26.github.io/libs/js/cls-PlainTable.js"></script>	
	
	<script>
	// generate dynamic dropdown content...
	genDynamicDropdown();
	function genDynamicDropdown(){
		let select = document.getElementById("pageDropdown");
		if(select){
				const ifb = new IFB();
				
				let TAB = [
						
				        ["", "--------------------------------------------------"],
				        [ifb.ROOT + ifb.path_features_wm_tl, "Features - WM - TL"],
				        [ifb.ROOT + ifb.path_features_wm_fl, "Features - WM - FL"],
				        [ifb.ROOT + ifb.path_features_ref, "Features - REF"],
				        [ifb.ROOT + ifb.path_features_ac, "Features - AC"],
				        [ifb.ROOT + ifb.path_features_mov, "Features - Microwave"],
				        [ifb.ROOT + ifb.path_features_dw, "Features - Dishwasher"],
				        [ifb.ROOT + ifb.path_features_cd, "Features - CD"],
				        [ifb.ROOT + ifb.path_features_ka, "Features - KA"],

				        ["", "--------------------------------------------------"],
				        [ifb.ROOT + ifb.path_dp_ALL, "DP - ALL"],
				        [ifb.ROOT + ifb.path_dp_wm_tl, "DP - WM - TL"],
				        [ifb.ROOT + ifb.path_dp_wm_fl, "DP - WM - FL"],
				        [ifb.ROOT + ifb.path_dp_ref, "DP - REF"],
				        [ifb.ROOT + ifb.path_dp_ac, "DP - AC"],
				        [ifb.ROOT + ifb.path_dp_mov, "DP - Microwave"],
				        [ifb.ROOT + ifb.path_dp_dw, "DP - Dishwasher"],
				        [ifb.ROOT + ifb.path_dp_cd, "DP - CD"],
				        [ifb.ROOT + ifb.path_dp_ka, "DP - KA"],
				        ["", "--------------------------------------------------"],

//						["https://nkg26.github.io/NE/res/ifb/features-wm-fl.tmp", "Features - WM - FL--2"],
//						["https://nkg26.github.io/NE/res/ifb/features-wm-tl.tmp", "Features - WM - TL -- 2"]
				];
				let content='';
				for(let i=0;i<TAB.length;i++)
					try{content += `<option value="${TAB[i][0]}"> ${TAB[i][1]}</option>\n`;}catch{}
				
				select.innerHTML = content;
		}
	}
	
	function goToPage() {
			// this will auto append random id to fetch latest data..
			
            const dropdown = document.getElementById("pageDropdown");
            const selectedValue = dropdown.value;
            if (selectedValue) {
                // window.location.href = selectedValue; // Opens the link in the same tab
                // window.open(selectedValue, '_blank'); // Use this instead if you want to open in a new tab:
				read_and_show_file(selectedValue);
            } else {
                alert("Please select a valid option first!");
            }
        }
	</script>

	<input type="text" id="searchInput" onkeyup="show_filtered_products()" placeholder="🔍 Search...">
	<div id="message"></div> 
	<div id="productGrid"></div>
	
  <script>  
	//let openInFreas
	const RN = Math.floor(Math.random()*10000);
	const Append_RN_TXT = '?rnd='+RN;
		
	const MY_TABLE = new PlainTable();
	function read_and_show_file(url){ 
		MY_TABLE.loadAndShowFileData(url+Append_RN_TXT);
	}
  
	function show_filtered_products(){ 
		var val = document.getElementById('searchInput').value;
		let data = MY_TABLE.filterByText(val);
		showFinalData(data);
	}
	
	function showFinalData(table_data){
		var html = MY_TABLE.FX_TABLE.generateBasicHtmlTable(table_data);
		document.getElementById('productGrid').innerHTML = html;
	}
  </script>
