	<script>
	// generate dynamic dropdown content...
	genDynamicDropdown();
	
	
	function genDynamicDropdown(){
		document.getElementById("div_custom").innerHTML = '<select id="pageDropdown"></select><button onclick="goToPage()">Go</button>';
	
		let select = document.getElementById("pageDropdown");
		if(select){
			const ifb = new IFB();

			let pList = ifb.pathList;
			const FXP = new FX_MyPList();
			
			let plist1 = FXP.filterByValue_LC(pList, 'type', 'features');
			let plist2 = FXP.filterByValue_LC(pList, 'type', 'dp');
			
			let t1 = [];
			plist1.forEach(item =>{ let a=item.rPath.split('/');  a=a[a.length-1]; a=a.split('.'); a=a[0].toUpperCase(); t1.push([ifb.ROOT + item.rPath, a]);});				
			t1.push(["", "--------------------------------------------------"]);
			plist2.forEach(item =>{ let a=item.rPath.split('/');  a=a[a.length-1]; t1.push([ifb.ROOT + item.rPath, a]);});
			t1.push(["", "--------------------------------------------------"]);
			let TAB = t1;
			
			let content='';
			for(let i=0;i<TAB.length;i++)
				try{content += `<option value="${TAB[i][0]}"> ${TAB[i][1]}</option>`;}catch{}
			
			select.innerHTML = content;
		}
	}
	
	function goToPage() {
			// this will auto append random id to fetch latest data..
			
            const dropdown = document.getElementById("pageDropdown");
            const selectedValue = dropdown.value;
            if (selectedValue) {
				new IO().readAndCallback(selectedValue, showNewDynamicData);
            } else {
                alert("Please select a valid option first!");
            }
        }
		function showNewDynamicData(data){
			try{ loadFreshData(data);} catch(e){alert('error in loading file..');}
			
		}

	const PROP = {}; // property
	const DP_KEY = 'dp'; // DP
	let RAW = `
SAP Code	Model Name	Category	TTL Vol	Star	MRP	DP	Old DP	DP Increase
8903287712852	Metal-Cool IFBDC-213AFSS	DC	187	1	₹ 18700	₹ 15700	₹ 15700	₹ 0
8903287712869	Metal-Cool IFBDC-213AFCS	DC	187	1	₹ 18700	₹ 15700	₹ 15700	₹ 0
8903287712876	Metal-Cool IFBDC-213AFAS	DC	187	1	₹ 18400	₹ 15400	₹ 15400	₹ 0`;

	const MY_TABLE = new PlainTable();
	const PFX = new FX_MyPList();
	loadFreshData(RAW);
	
	// calculate BP form DP
	function applyCalculation_PList(plist, KEY){
		// apply calculations
		for(let i=0; i<plist.length; i++){
			if(plist[i][KEY]){
				let num = parseInt(plist[i][KEY].replace('₹',''), 10); // 10 का मतलब Decimal नंबर सिस्टम है, remove char '₹'
				plist[i][KEY] = num+'<span style="font-size:0.5em;">'+" -18% = </span>"+(num + Math.trunc(num*.18));
			}
		}
	}
		
	function generateSub_PList(plist){
		return plist;
	}
	
	
	function loadFreshData(RAW_TABULAR_DATA){
		// convert raw data into table format
		let DATA = new MyTable().splitToTable(RAW_TABULAR_DATA.trim());
		new MyIFB().updateTableHeader(DATA); // updating table headers
		
		// update calculations
		let plist = PFX.toPList(DATA);
		PROP['main-pList'] = plist;
		PROP['all-cols'] = PFX.getUniqueKeys(plist);
		PROP['all-pCols'] = convertArrayToPList(PROP['all-cols'], 'col-name');
		PROP['all-pCols'].forEach(item => {item.selected=true;}); // insert attribute selected=true in each p.
		
		applyCalculation_PList(plist, DP_KEY);
		
		plist = generateSub_PList(plist);
		
		PROP['showable-pList'] = plist; // these are the final objects which will be shown as table..
		updateColumnFilterPan(); // generate checkbox to show selected table column.
		
		generateShowableTable();
		show_filtered_products();
	}
	
	// show all columns as check box.
	function updateColumnFilterPan(){
		let html = '';
		let A = PROP['all-pCols'];
		for(let i=0; i<A.length; i++){
			html += '<label><input type="checkbox" id="'+A[i]['col-name']+'" '+(A[i]['selected']===true?'checked':'')+' onchange=reshowTable(this)> '+A[i]['col-name']+'</label>';
		}
		document.getElementById('dcp_div').innerHTML = html;
	}
	
	function reshowTable(obj){
		PROP['all-pCols'].forEach(item => {if(item['col-name']===obj.id){item.selected = obj.checked;}}); // insert attribute selected=true in each p.
		generateShowableTable();
		show_filtered_products();
	}

	function generateShowableTable(){
		let pCols = PROP['all-pCols'].filter(item => item['selected']===true); // retrive p objects which are selected..
		let colNames = extarctValueAsArrayFromPList(pCols, 'col-name');		
		MY_TABLE.table_data = PFX.toTablularData(PROP['showable-pList'], colNames);
	}
	
	function convertArrayToPList(array, propName){
		let out = [];
		if(array)
		for(let i=0; i<array.length;i++){
			out.push({[propName]:array[i]});
		}		
		return out;
	}
	
	function extarctValueAsArrayFromPList(pList, propName){
		let out = [];
		for(let i=0; i<pList.length;i++){
			out.push(pList[i][propName]);
		}		
		return out;
	}
	
	function removeValuesInArray(array, removeNames){
		if(array && removeNames){
			for(let i=0; i<removeNames.length; i++){
				array = removeValueFromArray(array,removeNames[i]);
			}
		}
		return array;
	}
		
	function removeValueFromArray(array, removeName){
		return array.filter(item => item !== removeName); // remove column 'removeName'
	}
		
	function showData(){
		show_filtered_products();
	}
	
	function showHtml(html){
		document.getElementById("productGrid").innerHTML = html;
	}
	
	function showFilteredData(){ show_filtered_products(); }
	
	function show_filtered_products(){ 
		var val = document.getElementById('searchInput').value;
		let data = MY_TABLE.filterByText(val);
		showFinalData(data);
	}
		
	function showFinalData(table_data){
		let html = "";
		try {
			if(table_data){
				html = MY_TABLE.FX_TABLE.generateHighlightedHtmlTable(table_data, getSearchText());
			}
		} catch(e){html = e;}
			
		document.getElementById('productGrid').innerHTML = html;
	}
  
  </script>
