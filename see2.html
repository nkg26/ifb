			function go(e){
				const div = event.target.parentNode;
				let ip = null;
				let btn = null;
				
				if(event.type === 'keyup'){
					ip = event.target;
				}else if(event.type === 'click'){
					ip = document.getElementById(div.getAttribute('srchId'));
					ip.value = '';
				}
				
				ip = ip ? ip : document.getElementById(div.getAttribute('srchId'));
				btn = btn ? btn : document.getElementById(div.getAttribute('btnId'));
								
				let empty = (ip.value === '');
				init_search(div.id);
				searchBoxUpdated();
			}
						
			function init_search(DIV_ID){
				let div = document.getElementById(DIV_ID);
				let ip = document.getElementById(div.getAttribute('srchId'));
				let btn = document.getElementById(div.getAttribute('btnId'));
				let empty = (ip.value === '');	

				ip.style.width = empty?'100%':'80%';
				btn.style.display = empty?'none':'';
				search_text[ip.id] = ip.value;
			}
			
			init_search('div_search');

	<script>
	
	const FX_TABLE = new MyTable();
	const PFX = new FX_MyPList();
	
	
	// this is to preserve old-data
	class MY_DATA{
		PROP = {}; // property
		
		analyzeFreshRawData(RAW_TABULAR_DATA){
			// convert raw data into table format
			let DATA = new MyTable().splitToTable(RAW_TABULAR_DATA.trim());
			new MyIFB().updateTableHeader(DATA); // updating table headers
			
			let PROP = this.PROP;
			// update calculations
			let plist = PFX.toPList(DATA);
			PROP['main-pList'] = plist;
			PROP['all-cols'] = PFX.getUniqueKeys(plist);
			PROP['all-pCols'] = this.convertArrayToPList(PROP['all-cols'], 'col-name');
			PROP['all-pCols'].forEach(item => {item.selected=true;}); // insert attribute selected=true in each p.
			
			//this.applyCalculation_PList(plist, '');
			plist = this.generateSub_PList(plist);
			
			PROP['showable-pList'] = plist; // these are the final objects which will be shown as table..
		}
		
		// calculate BP form DP
		applyCalculation_PList(plist, KEY){
			// apply calculations
			for(let i=0; i<plist.length; i++){
				if(plist[i][KEY]){
					let num = parseInt(plist[i][KEY].replace('₹',''), 10); // 10 का मतलब Decimal नंबर सिस्टम है, remove char '₹'
					plist[i][KEY] = num+'<span style="font-size:0.5em;">'+" -18% = </span>"+(num + Math.trunc(num*.18));
				}
			}
		}
			
		generateSub_PList(plist){
			return plist;
		}

		generateShowableTable(){
			try{
				let PROP = this.PROP;
				let pCols = PROP['all-pCols'].filter(item => item['selected']===true); // retrive p objects which are selected..
				let colNames = this.extarctValueAsArrayFromPList(pCols, 'col-name');		
				return PFX.toTablularData(PROP['showable-pList'], colNames);
			}catch{}
			return '';
		}
		
		/*
		
		
		*/
	
		convertArrayToPList(array, propName){
			let out = [];
			if(array)
			for(let i=0; i<array.length;i++){
				out.push({[propName]:array[i]});
			}		
			return out;
		}
		
		extarctValueAsArrayFromPList(pList, propName){
			let out = [];
			for(let i=0; i<pList.length;i++){
				out.push(pList[i][propName]);
			}		
			return out;
		}
		
		removeValuesInArray(array, removeNames){
			if(array && removeNames)
				for(let i=0; i<removeNames.length; i++)
					array = this.removeValueFromArray(array,removeNames[i]);
			return array;
		}
			
		removeValueFromArray(array, removeName){
			return array.filter(item => item !== removeName); // remove column 'removeName'
		}
		
	}


	class Help{
		ALL_SRC = [];
		
		OBJ_MS = null; // master object
		getObjMS(){ return this.OBJ_MS; }
		getObjCls(){ return this.getObjMS() ? this.getObjMS().clsObj : null ; }
		getPROP(){ return this.getObjCls() ? this.getObjCls().PROP : null; }
		
		findByUID(value) {
			return this.findBy('uid', value);
		}
		
		findBy(porpKey, propValue) {
			return this.findByPList(this.ALL_SRC, porpKey, propValue);
		}
		
		findByPList(pList, porpKey, propValue) {
			for(let i=0; i<pList.length; i++) if(pList[i][porpKey] === propValue) return pList[i];
			return null;
		}
		
		// 
		updateColumnVisiblity(checkbox){
			let PROP = this.getPROP();
			PROP['all-pCols'].forEach(item => {if(item['col-name']===checkbox.id){item.selected = checkbox.checked;}}); // insert attribute selected=true in each p.
			this.table_data = this.getShowableData(); // regenerate new table..
		}
		
		getShowableData(){
			return this.getObjCls() ? this.getObjCls().generateShowableTable():'';
		}
		
		generateHtml_Dropdown(){
			let pList = this.ALL_SRC;
			
			let html = '';
			html += '<select id="pageDropdown"  onkeydown="if(event.key === \'Enter\'){ event.preventDefault(); go123();}">';
			pList.forEach(P =>{ try{html += '<option value="'+P.uid+'">'+P.name+'</option>';}catch{}});				
			html += '</select> <button onclick="go123()"  >Go</button> &nbsp; ';
			html += '<button onclick="refetchData()">Re-fetch Data</button> &nbsp; ';
			
			return html;
		}		
	
		// show all columns as check box. in html..
		generateHtml_ColumnFilter(){
			let PROP = this.getPROP();
			if(PROP)
			try {
				let html = '';
				let A = PROP['all-pCols'];
				for(let i=0; i<A.length; i++)
					html += '<label><input type="checkbox" id="'+A[i]['col-name']+'" '+(A[i]['selected']===true?'checked':'')+' onchange=showColumnUpdated(this)> '+A[i]['col-name']+'</label>';
				return html;
			} catch {}
			return '';
		}
				
		// isme header always return hoga..
		filterTabularDataByText(tablular_data, filter_text){
			return (filter_text.includes('&&')) 
				? this.filterTabularDataByText_multi(tablular_data, filter_text.split('&&'))
				: this.filterTabularDataByText_simple(tablular_data, filter_text);
		}
		
		filterTabularDataByText_multi(tablular_data, filter_text_list){
			filter_text_list.forEach(key =>{tablular_data = this.filterTabularDataByText_simple(tablular_data, key);});
			return tablular_data;
		}
		
		filterTabularDataByText_simple(tablular_data, filter_text){
			let text = filter_text.toLowerCase();
			return tablular_data.filter((row, rowIndex) => {
					if (rowIndex === 0) return true; // header always chaheye..
					for(let i=0; i<row.length; i++){
						if((row[i] === null || row[i] === undefined)?false:row[i].toLowerCase().includes(text)) return true;
					}
					
				return false;
			});	
		}

		// Table-2D to store current showing table data.. before text filter..
		table_data = [];
		
		asd(masterObject) { console.log("ok--1");}

/////////////		
		fetchNewData(new_raw_data, masterObject) {
			try {
				masterObject.clsObj = new MY_DATA();
				masterObject.clsObj.analyzeFreshRawData(new_raw_data);
				
				let THIS = masterObject['this-obj'];
				delete masterObject['this-obj'];
				THIS.autoAnalyseAndShowMS(masterObject);
			} catch(e){
				let THIS = masterObject['this-obj'];
				delete masterObject['this-obj'];
				THIS.autoAnalyseAndShowMS(null);
				
				console.log('<h1 style="color:red;"> Error in loading data : <br/><br/>'+masterObject.name+'</h1>');
				//console.log(e);
			}
		}
		
		showDataByUID(uid) { this.showDataByP(this.findByUID(uid)); /*masterObject */ }
		
		showDataByP(masterObject) {
			if (masterObject) {
				if(masterObject.clsObj){
					console.log("already exist data shown...");
					this.autoAnalyseAndShowMS(masterObject);
				}
				else {
					console.log("new data fetch and shown...");
					masterObject['this-obj']=this; // store temp this class object...					
					new IO().readAndCallback2(masterObject.url, this.fetchNewData, masterObject);
				}
			} else {
				alert("Please select a valid option first!");
			}
		}
		
		// this JSON  or P  contains an object of class MY_DATA.
		autoAnalyseAndShowMS(masterObject) {
			try{
				this.OBJ_MS = masterObject;
				this.table_data = this.getShowableData();
				document.getElementById('dcp_div').innerHTML = HELP.generateHtml_ColumnFilter();
				autoShowFinalOutput();
			}catch(e){
				console.error(e);
			}
		}
		
	/////////////		

	}
	
	const HELP = new Help();

	start();
	
	function start(){
		initializeData();
		HELP.ALL_SRC = initializeData();
		document.getElementById("div_custom").innerHTML = HELP.generateHtml_Dropdown();

		showOutputHTML(' we are storing old data into memory so that we can easily analyse data without fetching again and again..');
	}
	
	function initializeData(){
		const FXP = new FX_MyPList();
		const ifb = new IFB();
		let t1 = [];
		
		let pList = ifb.pathList;
		let plist1 = FXP.filterByValue_LC(pList, 'type', 'features');
		let plist2 = FXP.filterByValue_LC(pList, 'type', 'dp');
		
		plist1.forEach(item =>{ 
			let a=item.rPath.split('/');  
			a=a[a.length-1]; 
			a=a.split('.'); 
			a=a[0].toUpperCase(); 
			t1.push({'url':(ifb.ROOT + item.rPath), 'name':a, 'type':'features'});
			});

		plist2.forEach(item =>{ 
			let a=item.rPath.split('/');  
			a=a[a.length-1]; 
			a=a.split('.'); 
			a=a[0].toUpperCase(); 
			t1.push({'url':(ifb.ROOT + item.rPath), 'name':a, 'type':'dp'});
			});
		
		let ind=0; // for update UID
		t1.forEach(p => {p['uid'] = ++ind+'';});
		
		return t1;
	}
	
	function showAndHide(){
		let DIV = document.getElementById('div_control_panel');
		let ZOOM = document.getElementById('div_zoom');
		let SRCH = document.getElementById('div_search');
		let T1 = document.getElementById('dcp_div');
	}
		
	function refetchData(){ 
		if(HELP.getObjMS()){
			delete HELP.getObjMS().clsObj;
			console.log('old class object deleted...');
			go123();
		}
	}
	
	// when go button clicked...
	function go123() { HELP.showDataByUID(document.getElementById("pageDropdown").value); }
	
	
	// called when we change column selection..
	function showColumnUpdated(obj){
		HELP.updateColumnVisiblity(obj);
		autoShowFinalOutput();
	}

	function searchBoxUpdated(){ 
		autoShowFinalOutput(); 
	}

	function autoShowFinalOutput(highlightText=true){
		try {
			let Table2D = HELP.table_data;
			//Table2D = HELP.filterTabularDataByText(Table2D, document.getElementById('searchInput').value);
			
			
			let KEYS = Object.keys(search_text);
			
			KEYS.forEach(K =>{
				if(search_text[K]){
					Table2D = HELP.filterTabularDataByText(Table2D, search_text[K]);
				}else{
					delete search_text[K];
				}
			});
			
			
			let html = 'AA';
			
			if(highlightText && KEYS.length ==1)  // yahan 2D table html format me convert hoga + highlight
				html = FX_TABLE.generateHighlightedHtmlTable(Table2D, search_text[Object.keys(search_text)[0]]); 
			else 
				html = FX_TABLE.generateBasicHtmlTable(Table2D); 

			showOutputHTML(html);
		} catch(e){
			showOutputHTML(e);
		}
	}
  
	// final html output.
	function showOutputHTML(html){
		document.getElementById('productGrid').innerHTML = html;
	}
  
  </script>
